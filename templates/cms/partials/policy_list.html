{# Live policies from the portal app. #}
<div class="card" style="max-width:900px">
  {% for p in policies %}
  <div style="display:flex;gap:12px;align-items:center;padding:11px 0;{% if not forloop.last %}border-bottom:1px solid var(--line){% endif %}">
    <span style="flex:1;min-width:0">
      <span style="display:block;font-weight:700;font-size:13.5px">{{ p.title }}</span>
      {% if p.category %}<span class="muted" style="display:block;font-size:11.5px;margin-top:2px">{{ p.category }}</span>{% endif %}
    </span>
    {% if p.file %}<a href="{{ p.file.url }}" class="btn ghost sm" download>Download</a>{% endif %}
  </div>
  {% empty %}
  <div class="muted" style="font-size:13px;padding:6px 0">No policies published yet.</div>
  {% endfor %}
</div>
