{% include 'cms/_section_head.html' %}
<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr))">
  {% for item in section.visible_items %}
    {% if item.image %}
    <figure style="margin:0;border:1px solid var(--line);background:var(--paper-2)">
      <img src="{{ item.image.url }}" alt="{{ item.title }}" loading="lazy"
           style="display:block;width:100%;aspect-ratio:4/3;object-fit:cover">
      {% if item.title or item.meta %}
      <figcaption style="padding:9px 11px">
        {% if item.title %}<div style="font-weight:700;font-size:12.5px">{{ item.title }}</div>{% endif %}
        {% if item.meta %}<div class="muted" style="font-size:11px;margin-top:2px">{{ item.meta }}</div>{% endif %}
      </figcaption>
      {% endif %}
    </figure>
    {% endif %}
  {% empty %}
  <div class="muted" style="font-size:13px">No images yet.</div>
  {% endfor %}
</div>
