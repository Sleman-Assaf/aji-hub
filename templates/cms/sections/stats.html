{% include 'cms/_section_head.html' %}
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
  {% for item in section.visible_items %}
  <div class="card" style="padding:18px 20px">
    <div style="font-size:28px;font-weight:700;letter-spacing:-.035em;line-height:1">{{ item.title }}</div>
    <div class="muted" style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:6px">{{ item.text }}</div>
    {% if item.meta %}<div class="muted" style="font-size:11.5px;margin-top:5px">{{ item.meta }}</div>{% endif %}
  </div>
  {% empty %}
  <div class="muted" style="font-size:13px">No figures yet.</div>
  {% endfor %}
</div>
