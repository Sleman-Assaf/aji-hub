{% include 'cms/_section_head.html' %}
{% with embed=section.config.embed %}
<div class="card" style="max-width:900px;padding:0;overflow:hidden">
  {% if embed %}
  <div style="position:relative;width:100%;aspect-ratio:16/9;background:var(--bed)">
    <iframe src="{{ embed }}" title="{{ section.title|default:'Video' }}" loading="lazy"
            allowfullscreen referrerpolicy="no-referrer"
            style="position:absolute;inset:0;width:100%;height:100%;border:0"></iframe>
  </div>
  {% else %}
  <div class="muted" style="padding:26px;font-size:13px">No video URL set on this section yet.</div>
  {% endif %}
</div>
{% endwith %}
