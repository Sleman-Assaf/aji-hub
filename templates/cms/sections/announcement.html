{% load cms_tags %}
<div class="card" style="max-width:900px;border-left:3px solid var(--yellow)">
  <div style="display:flex;align-items:center;gap:9px;margin-bottom:9px">
    {% if section.icon %}<span style="color:var(--yellow-deep)">{% cms_icon section.icon 18 %}</span>{% endif %}
    {% if section.title %}<div style="font-weight:700;font-size:15.5px;letter-spacing:-.01em">{{ section.title }}</div>{% endif %}
    {% if section.subtitle %}<span class="pill warn" style="margin-left:auto">{{ section.subtitle }}</span>{% endif %}
  </div>
  {% if section.body or cms_edit_mode %}<div style="font-size:13.5px;line-height:1.65;color:var(--ink-2)"
  {% if cms_edit_mode %}data-ed-field="body" data-ed-rich contenteditable="true"{% endif %}>{{ section.body_rendered }}</div>{% endif %}
</div>
